# PPR core side of the zbus proxy agent. Added to the PPR image by app/sysbuild.cmake when a
# module is placed on the PPR core. The proxy agent itself is selected by the modules.
# The PPR runs from 64 KB of RAM, keep the zbus footprint small.
CONFIG_ZBUS_PROXY_AGENT_WORK_QUEUE_STACK_SIZE=768
CONFIG_ZBUS_PROXY_AGENT_RX_QUEUE_DEPTH=2

# RAM trimming. The PPR image runs from RAM (no XIP), so code, log strings and stacks all share
# the same 60 KB. The module log levels are left at the default (INF) for the same reason, set
# CONFIG_APP_PWM_LOG_LEVEL_DBG / CONFIG_APP_SAADC_LOG_LEVEL_DBG in the ppr image to debug them.
# main() only logs a line every few seconds and nothing is submitted to the system workqueue.
CONFIG_MAIN_STACK_SIZE=768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
