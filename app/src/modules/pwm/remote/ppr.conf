# PPR core side of the PWM module. Added to the PPR image by app/sysbuild.cmake when
# SB_CONFIG_ATT_PWM_ON_PPR is enabled.
CONFIG_APP_PWM=y

# The peripheral is owned by the PPR, so its interrupt routing and pin ownership must be part of
# the PERIPHCONF. Without this the PPR image generates no PERIPHCONF entries, and the interrupt
# of the peripheral is not routed to the PPR. The entries are generated from the devicetree and
# included in the UICR by the UICR image.
CONFIG_NRF_PERIPHCONF_SECTION=y

# MCUboot's entries for the shared pins and peripherals (buttons, LEDs, uart132, GRTC) are not
# locked. Locked PPR entries for the same registers make the UICR PERIPHCONF check fail with
# fatal CONFLICTING_VALUES, so generate them unlocked as well.
CONFIG_NRF_PERIPHCONF_GENERATE_ENTRIES_LOCK=n
