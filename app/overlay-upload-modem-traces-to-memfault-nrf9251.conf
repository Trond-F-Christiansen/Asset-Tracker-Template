# Continuously store modem traces to MRAM and upload them to Memfault upon a
# coredump. Pair with overlay-upload-modem-traces-to-memfault-nrf9251.overlay.

# Memfault
CONFIG_MEMFAULT_NCS_POST_COREDUMP_ON_NETWORK_CONNECTED=y
CONFIG_MEMFAULT_NCS_POST_MODEM_TRACE_ON_COREDUMP=y

# nRF Modem lib trace, flash backend stored on MRAM.
CONFIG_FCB=y
CONFIG_FLASH_MAP=y
CONFIG_NRF_MODEM_LIB_TRACE=y
# Start with tracing off; the Memfault modem-trace layer re-enables it once the
# coredump/trace has been uploaded, or immediately if there is no coredump.
CONFIG_NRF_MODEM_LIB_TRACE_LEVEL_OFF=y
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_FLASH=y
CONFIG_NRF_MODEM_TRACE_FLASH_NOSPACE_ERASE_OLDEST=y
CONFIG_NRF_MODEM_LIB_TRACE_STACK_SIZE=896
# 512 KiB modem_trace partition on MRAM = 128 sectors of 4 KiB.
CONFIG_NRF_MODEM_LIB_TRACE_FLASH_SECTORS=128
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_FLASH_PARTITION_SIZE=0x80000
CONFIG_NRF_MODEM_LIB_SHELL_TRACE=y
