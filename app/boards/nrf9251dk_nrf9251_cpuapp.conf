CONFIG_LOG_TIMESTAMP_64BIT=y

# Settings are stored in MRAM, which ZMS supports and FCB does not.
CONFIG_SETTINGS_FCB=n
CONFIG_FCB=n
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# External flash
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Full modem FOTA
CONFIG_NRF_CLOUD_FOTA_FULL_MODEM_UPDATE=y
CONFIG_STREAM_FLASH_ERASE=y

# No NSIB (b0), so there is no bootloader version to report.
CONFIG_NRF_CLOUD_SEND_DEVICE_INFO_BOOTLOADER_VERSION=n

# slot0 is write protected by MPCCONF, so the image trailer cannot be updated to
# confirm an update. Boot requests move that signal to boot_request_partition.
CONFIG_CRC=y
CONFIG_NRF_MCUBOOT_BOOT_REQUEST=y

# Memfault coredumps are stored in MRAM (memfault_coredump_partition in the board
# overlay).
CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP=n
CONFIG_MEMFAULT_NCS_FW_TYPE="att"
CONFIG_MEMFAULT_LOGGING_RAM_SIZE=16384
# Heartbeat and upload are driven by the application's sample cycle instead of the
# Memfault SDK timers (memfault/memfault_sync.c).
CONFIG_APP_MEMFAULT_SYNC_WITH_SAMPLING=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD=n
CONFIG_MEMFAULT_COREDUMP_STORAGE_NRF_MRAM=y

# Wi-Fi location using the built-in nRF92 Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_NRF92=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_DUMMY=y
CONFIG_NET_OFFLOAD=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=50

# Configure location priority order and timeouts
CONFIG_LOCATION_METHOD_WIFI=y
CONFIG_LOCATION_WORKQUEUE_STACK_SIZE=8192
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_FIRST_GNSS=y
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_SECOND_WIFI=y
CONFIG_LOCATION_REQUEST_DEFAULT_METHOD_THIRD_CELLULAR=y
CONFIG_LOCATION_METHOD_WIFI_SCANNING_RESULTS_MAX_CNT=10
# The nRF92 Wi-Fi driver has no scan abort: when the request times out, the modem
# keeps scanning in the background and the late result is dropped.
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_TIMEOUT=10000
# APs send a beacon every 102.4 ms, delayed by up to ~30 ms on a busy channel. 260 ms
# per channel gives each AP two chances to be heard.
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_DWELL_TIME_PASSIVE=260
# Most 2.4 GHz APs use the non-overlapping channels 1, 6 and 11. Scanning only these
# reduces scan time and power consumption.
CONFIG_LOCATION_REQUEST_DEFAULT_WIFI_CHANNELS="2:1,6,11"
CONFIG_WIFI_NRF92_INCREASE_MAX_GAIN=y

# Wi-Fi scan heap allocations should be changed when
# CONFIG_LOCATION_METHOD_WIFI_SCANNING_RESULTS_MAX_CNT is changed.
CONFIG_HEAP_MEM_POOL_SIZE=40000

# Application-core die temperature (DUT temp) via the nRFS temperature service.
CONFIG_SENSOR=y
CONFIG_NRFS=y

CONFIG_MEMFAULT_REBOOT_REASON_GET_HWINFO=y
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=400

# PWM and SAADC modules. The core that runs the module is selected with
# SB_CONFIG_ATT_PWM_ON_PPR and SB_CONFIG_ATT_SAADC_ON_PPR.
CONFIG_APP_PWM=y
CONFIG_APP_SAADC=y

# nRF9251 has no modem %JWT path (MODEM_JWT) and no nRF Cloud provisioning service.
# The application generates the nRF Cloud JWT itself (src/modules/cloud/cloud_jwt.c).
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_IMEI=y
CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_IMEI=y
CONFIG_HWINFO=y
CONFIG_MODEM_JWT=n
# Keeps app_jwt, BASE64 and TLS_CREDENTIALS selected. The library's own custom
# JWT implementation is never called because the application wraps
# nrf_cloud_jwt_generate(), but dropping this option also drops those selects,
# which breaks APP_CLOUD_JWT_TEST_KEY_BUILTIN and the Memfault CoAP upload.
CONFIG_NRF_CLOUD_JWT_SOURCE_CUSTOM=y
CONFIG_APP_CLOUD_JWT_ISS_HW_PREFIX="nrf9251"
CONFIG_NRF_PROVISIONING=n
CONFIG_NRF_PROVISIONING_COAP=n
CONFIG_NRF_CLOUD_COAP_MAX_USER_OPTIONS=2

# Set max number of messages to send in one batch to max allowable to support
# uploading coredumps and modem traces in one upload attempt.
CONFIG_MEMFAULT_COAP_MAX_MESSAGES_TO_SEND=10000

# Networking (required by the Wi-Fi driver's offloaded L2)
CONFIG_NETWORKING=y

# SMP server on its own UART (uart132 / VCOM1) so the console and shell keep
# VCOM0 to themselves.
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_NET_BUF=y
