CONFIG_SETTINGS_FCB=n
CONFIG_FCB=n
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

CONFIG_LOG_TIMESTAMP_64BIT=y

# Cloud CoAP can use custom JWT generation in-app as long as the private key
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_IMEI=y
CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_IMEI=y
CONFIG_HWINFO=y

# nRF9251 currently does not support the modem %JWT path used by MODEM_JWT.
# Use custom JWT generation.
CONFIG_MODEM_JWT=n
# Keeps app_jwt, BASE64 and TLS_CREDENTIALS selected. The library's own custom
# JWT implementation is never called because the application wraps
# nrf_cloud_jwt_generate(), but dropping this option also drops those selects,
# which breaks APP_CLOUD_JWT_TEST_KEY_BUILTIN and the Memfault CoAP upload.
CONFIG_NRF_CLOUD_JWT_SOURCE_CUSTOM=y
CONFIG_APP_CLOUD_JWT_ISS_HW_PREFIX="nrf9251"

# Overrides the upstream default of 0x800 for SOC_SERIES_NRF92.
CONFIG_FW_INFO_OFFSET=0x1000

CONFIG_NRF_PROVISIONING=n
CONFIG_NRF_PROVISIONING_COAP=n

CONFIG_NRF_CLOUD_COAP_MAX_USER_OPTIONS=2

CONFIG_NRF_CLOUD_SEND_DEVICE_INFO_BOOTLOADER_VERSION=n

CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NCS_FW_TYPE="att"
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=2048
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOGGING_RAM_SIZE=16384
CONFIG_MEMFAULT_PERIODIC_UPLOAD=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD_USE_DEDICATED_WORKQUEUE=y
# Coredump storage: RAM-backed (noinit), MRAM not ready yet.
CONFIG_MEMFAULT_COREDUMP_STORAGE_CUSTOM=n
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=65536
CONFIG_MEMFAULT_USE_NRF_CLOUD_COAP=y
CONFIG_MEMFAULT_HTTP_ENABLE=n
CONFIG_MEMFAULT_COAP_MAX_MESSAGES_TO_SEND=10000
CONFIG_MEMFAULT_COREDUMP_NVIC_INTERRUPTS_TO_COLLECT=32
CONFIG_MEMFAULT_COREDUMP_MAX_TRACKED_TASKS=32
CONFIG_MEMFAULT_COREDUMP_COLLECT_DATA_REGIONS=y
CONFIG_MEMFAULT_COREDUMP_COLLECT_BSS_REGIONS=y
CONFIG_MEMFAULT_COREDUMP_FULL_THREAD_STACKS=y

CONFIG_THREAD_STACK_INFO=y
# Large coredumps need more time per CoAP exchange than metrics-only uploads.
CONFIG_MEMFAULT_COAP_CLIENT_TIMEOUT_MS=30000
CONFIG_MEMFAULT_NCS_LTE_METRICS=y
CONFIG_MEMFAULT_NCS_LOCATION_METRICS=y
CONFIG_MEMFAULT_NCS_STACK_METRICS=n
CONFIG_MEMFAULT_FS_BYTES_FREE_METRIC=n
CONFIG_POSIX_FILE_SYSTEM=n

CONFIG_MEMFAULT_REBOOT_REASON_GET_HWINFO=y
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=400

